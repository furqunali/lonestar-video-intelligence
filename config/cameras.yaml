# Per-camera register + zone polygons.
#
# Confirmed against the filled Data Request Form (Camera Audit team, 29 Aug 2026):
# six register cameras, two per PoC site, on i3 SRX-Pro servers exported to MP4
# via FreeCam. Sites: 0008 Mesa Valero, 0025 Polo Club, 0028 Woodridge.
#
# Cameras are identified by number ("Register 1/2"); functional zone names are
# assigned here from camera coverage (the team confirmed this is expected).
#
# NOTE: camera/server IPs, ports and DVR login credentials from the intake docs
# are deliberately NOT stored here. This offline PoC reads exported MP4 files and
# needs no live connection or credentials (CLAUDE.md §3, design rule #6). If a
# later gate adds live pull, those secrets come from env/.env, never this file.
#
# Zone polygons are NORMALIZED (x, y in 0..1) and scaled to each frame's pixel
# size at runtime, so they are independent of the DVR export resolution.

cameras:
  # ---- 0008 Mesa Valero ----
  - camera_id: "CAM-0008-1"
    location_id: "0008"
    name: "Register 1"
    model: "i3 SRX-Pro (FreeCam MP4)"
    zones:
      register:   [[0.30, 0.35], [0.70, 0.35], [0.70, 0.95], [0.30, 0.95]]
      sales_floor: [[0.00, 0.10], [1.00, 0.10], [1.00, 1.00], [0.00, 1.00]]
      entrance:   [[0.72, 0.05], [0.98, 0.05], [0.98, 0.55], [0.72, 0.55]]
