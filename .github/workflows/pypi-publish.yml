name: Publish to PyPI

# Builds the `avip` package and publishes it to PyPI when a GitHub Release is
# published. Requires a repo secret PYPI_API_TOKEN (Settings -> Secrets and
# variables -> Actions). `skip-existing` avoids errors if the version already
# exists.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
