name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libs (OpenCV runtime)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install (offline test deps — no torch/ultralytics; the one YOLO test self-skips)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic pydantic-settings PyYAML SQLAlchemy structlog \
                      numpy tzdata "opencv-contrib-python-headless>=4.9" scikit-image \
                      "supervision>=0.18" av imageio-ffmpeg
          pip install -e . --no-deps
      - name: Run test suite
        run: |
          pytest -q | tee out.txt
          {
            echo "## ✅ Test results";
            echo '```';
            tail -n 3 out.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
